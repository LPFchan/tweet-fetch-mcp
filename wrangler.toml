name = "tweet-fetch"
main = "index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Not on a workers.dev subdomain. This is load-bearing rather than tidy:
# wrangler defaults `workers_dev` to `routes.length === 0`, so with no routes
# below it would otherwise publish this Worker at
# tweet-fetch.<subdomain>.workers.dev -- a public entrance to a Worker whose
# whole security model is that it has none. It would fail closed (no identity
# headers, so 500 on everything), but "reachable only through the gateway's
# service binding" would stop being true.
workers_dev = false

[vars]
FETCH_TIMEOUT_MS = "15000"

# ---------------------------------------------------------------------------
# NO ROUTES. THIS IS DELIBERATE.
# ---------------------------------------------------------------------------
#
# This Worker is a route-less backend, reached only through the TWEET_FETCH
# service binding declared by the `auth-gateway` Worker (auth/gateway/
# wrangler.toml). The gateway holds the four zone routes for this host:
#
#   tweet.lost.plus/mcp
#   tweet.lost.plus/mcp/*
#   tweet.lost.plus/healthz
#   tweet.lost.plus/.well-known/oauth-protected-resource*
#
# Adding routes here would take them from the gateway on the next deploy and
# expose this Worker without authentication. Do not.
#
# No secrets, no AUTH_URL, no TOKEN_SCOPE: this Worker never talks to
# auth.lost.plus. The scope lives in the gateway's route table
# (auth/gateway/config/cloudflare.gateway.json).
