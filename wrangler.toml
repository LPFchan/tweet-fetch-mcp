name = "tweet-fetch"
main = "index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AUTH_URL = "https://auth.lost.plus"
TOKEN_SCOPE = "tweet-fetch"
FETCH_TIMEOUT_MS = "15000"

# Route tweet.lost.plus MCP traffic to this Worker.
# The OCI gateway still handles other paths (healthz, root) until DNS is cut over.
routes = [
  { pattern = "tweet.lost.plus/mcp", zone_name = "lost.plus" },
  { pattern = "tweet.lost.plus/mcp/*", zone_name = "lost.plus" },
  { pattern = "tweet.lost.plus/healthz", zone_name = "lost.plus" },
  { pattern = "tweet.lost.plus/.well-known/oauth-protected-resource*", zone_name = "lost.plus" },
]
